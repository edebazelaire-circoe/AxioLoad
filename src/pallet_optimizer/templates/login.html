<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Connexion · AxioLoad</title>
  <link rel="icon" type="image/svg+xml" href="/static/brand/favicon.svg">
  <link rel="stylesheet" href="/static/app.css?v={{ app_version }}">
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--surface-2)}
    .login-shell{width:min(520px,100%);padding:28px;border:1px solid var(--line);border-radius:20px;background:var(--paper);box-shadow:var(--shadow)}
    .login-logo{width:min(280px,70%);margin-bottom:22px}.login-form{display:grid;gap:14px}.login-actions{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:6px}.login-help{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);margin:12px 0;color:var(--muted)}
  </style>
</head>
<body>
  <main class="login-shell">
    <img class="login-logo" src="/static/brand/axioload-horizontal-dark.svg" alt="AxioLoad">
    <div class="eyebrow">Espace client</div>
    <h1>Connexion</h1>
    <p>Utilisez l’identifiant de votre entreprise reçu lors de l’invitation.</p>
    <div class="login-help">L’inscription libre n’est pas disponible. Les comptes sont créés exclusivement par le super administrateur.</div>
    <form id="login-form" class="login-form">
      <label>Identifiant de l’entreprise<input name="tenant_id" autocomplete="organization" required></label>
      <label>Adresse e-mail<input name="email" type="email" autocomplete="username" required></label>
      <label>Mot de passe<input name="password" type="password" autocomplete="current-password" required></label>
      <div class="login-actions"><a href="/">Retour à l’accueil local</a><button class="primary" type="submit">Se connecter</button></div>
    </form>
    <div id="login-message" class="message hidden" role="alert"></div>
  </main>
  <script src="/static/login.js?v={{ app_version }}"></script>
</body>
</html>
