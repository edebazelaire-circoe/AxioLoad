[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pallet-loading-optimizer"
version = "0.14.0"
description = "AxioLoad deterministic transport loading optimizer"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<1",
  "pydantic>=2.13,<3",
  "uvicorn>=0.48,<1",
  "jinja2>=3.1,<4",
  "openpyxl>=3.1,<4",
  "reportlab>=4.4,<5",
  "python-multipart>=0.0.29,<1",
  "cryptography>=46,<47",
  "pillow>=12,<13",
  "pypdf>=5,<6",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "httpx>=0.28,<1"]
solver = ["ortools>=9.12,<10"]
routing = ["pyvrp>=0.13,<0.14"]

[project.scripts]
pallet-optimizer = "pallet_optimizer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
pallet_optimizer = ["static/*", "static/brand/*", "templates/*"]
