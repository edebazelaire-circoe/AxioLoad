<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nouveau mot de passe · AxioLoad</title>
  <link rel="icon" type="image/svg+xml" href="/static/brand/favicon.svg">
  <link rel="stylesheet" href="/static/app.css?v={{ app_version }}">
</head>
<body class="password-page">
  <main class="password-card">
    <img class="password-logo" src="/static/brand/axioload-horizontal-dark.svg" alt="AxioLoad">
    <div class="eyebrow">Sécurité du compte</div>
    <h1>Choisir un nouveau mot de passe</h1>
    <p>{{ actor }}</p>
    {% if required_change %}
    <div class="message warning">Le mot de passe transmis par le super administrateur est temporaire. Choisissez maintenant votre mot de passe personnel.</div>
    {% endif %}
    <form id="change-password-form" class="password-form">
      <label>Mot de passe actuel<input name="current_password" type="password" autocomplete="current-password" required></label>
      <label>Nouveau mot de passe<input name="new_password" type="password" autocomplete="new-password" minlength="10" required></label>
      <label>Confirmer le nouveau mot de passe<input name="confirm_password" type="password" autocomplete="new-password" minlength="10" required></label>
      <button class="primary" type="submit">Enregistrer le nouveau mot de passe</button>
    </form>
    <div id="change-password-message" class="message hidden" role="alert"></div>
    <a class="password-back" href="/login">Retour à la connexion</a>
  </main>
</body>
</html>
