name: CI

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "32 2 * * *"
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev]'
      - name: Install Chromium for real UI tests
        run: python -m playwright install --with-deps chromium
      - run: python -m compileall -q src
      - run: pytest
      - name: Upload browser trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-navigation-debug
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
      - run: docker build -t pallet-loading-optimizer:test .
